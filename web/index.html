<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IP 类型查询</title>
<meta name="description" content="查询出口 IP 的类型（家宽、机房、移动等）、纯净度和基础信息">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" data-nav><img src="/static/favicon.svg" alt="" width="24" height="24">IP 类型查询</a>
    <form id="q" class="search" autocomplete="off" novalidate>
      <label for="qi" class="vh">IP 地址</label>
      <input id="qi" type="text" spellcheck="false" autocapitalize="off" maxlength="64" placeholder="输入 IPv4 或 IPv6 地址">
      <button type="submit" class="btn primary">查询</button>
      <button type="button" id="me" class="btn">查我的 IP</button>
    </form>
  </div>
  <p id="qerr" class="wrap qerr" role="alert" hidden></p>
</header>
<main class="wrap">
  <div id="status" class="status" aria-live="polite"></div>
  <div id="out">
    <section id="result" class="card verdict" aria-busy="true">
      <div class="summary-identity"><div class="v-ip"><h1 id="ipAddress">__IP_ADDRESS__</h1></div><p class="v-label">识别中…</p></div>
      <div id="score" class="score"><div class="ring wait" style="--v:0;--h:200"><b id="scoreValue">—</b><span id="scoreLevel">评估中…</span></div><span class="mut">纯净度 <span id="scoreTotal">/100</span></span></div>
    </section>
  </div>
</main>
<dialog id="scoreDetails" aria-labelledby="scoreDetailsTitle">
  <div class="score-detail-head"><h2 id="scoreDetailsTitle">评分详情</h2><button id="scoreDetailsClose" type="button" class="btn" aria-label="关闭评分详情">关闭</button></div>
  <div id="scoreDetailsBody"></div>
</dialog>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IP 类型查询</title>
<meta name="description" content="查询出口 IP 的类型（家宽、机房、移动等）、纯净度和基础信息">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="/" data-nav><img src="/static/favicon.svg" alt="" width="24" height="24">IP 类型查询</a>
    <form id="q" class="search" autocomplete="off" novalidate>
      <label for="qi" class="vh">IP 地址</label>
      <input id="qi" type="text" spellcheck="false" autocapitalize="off" maxlength="64" placeholder="输入 IPv4 或 IPv6 地址">
      <button type="submit" class="btn primary">查询</button>
      <button type="button" id="me" class="btn">查我的 IP</button>
    </form>
  </div>
  <p id="qerr" class="wrap qerr" role="alert" hidden></p>
</header>
<main class="wrap">
  <div id="status" class="status" aria-live="polite"></div>
  <div id="out">
    <section id="result" class="card verdict" aria-busy="true">
      <div class="summary-identity"><div class="v-ip"><h1 id="ipAddress">__IP_ADDRESS__</h1></div><p class="v-label">识别中…</p></div>
      <div id="score" class="score"><div class="ring wait" style="--v:0;--h:200"><b id="scoreValue">—</b><span id="scoreLevel">评估中…</span></div><span class="mut">纯净度 <span id="scoreTotal">/100</span></span></div>
    </section>
  </div>
</main>
<footer class="wrap foot">
  <a class="gh-link" href="https://github.com/zzusec/ip-lookup" target="_blank" rel="noopener noreferrer"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub</a>
</footer>
<dialog id="scoreDetails" aria-labelledby="scoreDetailsTitle">
  <div class="score-detail-head"><h2 id="scoreDetailsTitle">评分详情</h2><button id="scoreDetailsClose" type="button" class="btn" aria-label="关闭评分详情">关闭</button></div>
  <div id="scoreDetailsBody"></div>
</dialog>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IP 类型查询</title>
<meta name="description" content="查询出口 IP 的类型（家宽、机房、移动等）、纯净度、人机流量比例、同段邻居审计与自治系统路由画像">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body data-connection="/static/connection.js">
<header class="top">
  <div class="wrap top-in">
    <nav class="top-nav" aria-label="功能导航">
      <a class="brand" href="/" data-nav aria-label="IP 类型查询"><img src="/static/favicon.svg" alt="" width="24" height="24"></a>
      <div class="top-tabs">
        <a class="top-tab active" href="/" data-nav aria-current="page">IP 类型查询</a>
        <a id="riskTab" class="top-tab" href="https://github.com/zzusec/whoprobe" target="_blank" rel="noopener noreferrer">IP风控值检测</a>
      </div>
    </nav>
    <form id="q" class="search" autocomplete="off" novalidate>
      <label for="qi" class="vh">IP 地址</label>
      <input id="qi" type="text" spellcheck="false" autocapitalize="off" maxlength="64" placeholder="输入 IPv4 或 IPv6 地址">
      <button type="submit" class="btn primary">查询</button>
      <button type="button" id="me" class="btn">查我的 IP</button>
    </form>
  </div>
  <p id="qerr" class="wrap qerr" role="alert" hidden></p>
</header>
<main class="wrap">
  <div id="status" class="status" aria-live="polite"></div>
  <div id="out">
    <section id="result" class="card verdict" aria-busy="true">
      <div class="summary-identity"><div class="v-ip"><h1 id="ipAddress">__IP_ADDRESS__</h1></div><p class="v-label">识别中…</p></div>
      <div class="verdict-side"><div id="score" class="score"><div class="ring wait" style="--v:0;--h:200"><b id="scoreValue">—</b><span id="scoreLevel">评估中…</span></div><div class="score-meta"><span class="mut">纯净度 <span id="scoreTotal">/100</span></span></div></div></div>
    </section>
  </div>
</main>
<footer class="wrap foot">
  <div class="foot-in">
    <span>IP 类型与信誉查询 · 多源路由、原生性与实时黑名单核验</span>
    <div class="foot-links">
      <span>实时计算 · 不持久化访客日志</span>
      <span id="footerWhoWrap" hidden> · <a id="footerWhoLink" href="#" target="_blank" rel="noopener noreferrer">全栈风控与指纹自检 →</a></span>
      <span> · </span>
      <button id="backTopBtn" type="button" class="foot-btn">返回顶部 ↑</button>
    </div>
  </div>
</footer>
<dialog id="scoreDetails" aria-labelledby="scoreDetailsTitle">
  <div class="score-detail-head"><h2 id="scoreDetailsTitle">评分详情</h2><button id="scoreDetailsClose" type="button" class="btn" aria-label="关闭评分详情">关闭</button></div>
  <div id="scoreDetailsBody"></div>
</dialog>
</body>
</html>

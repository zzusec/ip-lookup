<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>节点控制台 · IP 查询站</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <section id="loginPage" class="auth-shell" hidden aria-labelledby="loginTitle">
    <div class="auth-panel">
      <div class="auth-head">
        <img src="/static/favicon.svg" width="28" height="28" alt="">
        <div>
          <h1 id="loginTitle">节点运行与遥测控制台</h1>
          <p>验证管理员凭据以读取实时流量与数据源状态</p>
        </div>
      </div>
      <form id="loginForm" method="post" action="/admin/api/login">
        <label class="field">
          <span>管理员账号</span>
          <input id="u" name="username" aria-label="管理员账号" autocomplete="username" value="admin" required>
        </label>
        <label class="field">
          <span>管理密码</span>
          <input id="p" name="password" aria-label="管理密码" type="password" autocomplete="current-password" placeholder="输入口令" required>
        </label>
        <button type="submit" id="submitLogin" class="btn primary full">进入控制台</button>
        <div id="loginErr" class="auth-err" role="alert" aria-live="polite"></div>
      </form>
      <div class="auth-meta">
        <span class="mono" id="loginHost">IP Lookup</span>
        <a href="/" target="_blank" rel="noreferrer">返回公开查询页</a>
      </div>
    </div>
  </section>

  <div id="bootNotice" class="boot-state" role="status" aria-live="polite">
    <span id="notice">正在连接节点控制台…</span>
    <button id="retry" type="button" class="btn" hidden>重试</button>
  </div>

  <div id="app" class="console" hidden>
    <header class="masthead">
      <div class="wrap mast-row">
        <div class="mast-brand">
          <a href="/" target="_blank" rel="noreferrer" class="brand-mark" title="打开公开查询首页">
            <img src="/static/favicon.svg" width="24" height="24" alt="">
            <span>IP 查询站</span>
          </a>
          <span class="mast-sep">/</span>
          <span class="mast-title">节点控制台</span>
          <span class="status-pill ok" id="roleBadge">运行正常</span>
        </div>

        <nav class="tab-bar" id="topNav" aria-label="控制台分区">
          <button type="button" class="tab active" data-view="dashboard">概览</button>
          <button type="button" class="tab" data-view="visits">实时流量</button>
          <button type="button" class="tab" data-view="analytics">趋势分布</button>
          <button type="button" class="tab" data-view="sources">情报源<span class="tab-dot" id="sourcesNavBadge" hidden></span></button>
          <button type="button" class="tab" data-view="security">安全访问<span class="tab-dot" id="secNavBadge" hidden></span></button>
        </nav>

        <div class="mast-ops">
          <span class="stamp mono" id="refreshedAt"></span>
          <label class="pulse-toggle" id="autoRefreshLabel" title="每 10 秒自动同步当前视图">
            <input type="checkbox" id="autoRefreshChk">
            <span class="mono" id="arSec">10s</span>
          </label>
          <button type="button" class="btn sm" id="refreshBtn">刷新</button>
          <button type="button" class="btn sm quiet" id="logout">退出</button>
        </div>
      </div>
    </header>

    <main class="wrap deck">
      <div id="inlineBanner" class="banner" hidden role="status" aria-live="polite"></div>
      <div id="subBar" class="sub-bar" hidden>
        <button type="button" class="btn sm" id="backBtn">返回上一视图</button>
        <span class="mut" id="subCrumb"></span>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="ipDialog" class="ip-dialog" aria-labelledby="dName">
    <div class="dlg-head">
      <h2 id="dName" class="mono">IP 详情</h2>
      <button type="button" class="btn sm" id="drawerClose" aria-label="关闭详情">关闭</button>
    </div>
    <div id="dBody" class="dlg-body"></div>
  </dialog>

  <noscript>此控制台需要启用 JavaScript。</noscript>
</body>
</html>
